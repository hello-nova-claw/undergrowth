name: Plugin Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build
        if: hashFiles('src/**/*.js') != ''
        run: |
          npm ci
          npm run build
      # Check the plugin as it would ship to WordPress.org, not the repository.
      - run: rsync -a --exclude-from=.distignore ./ dist/undergrowth/
      - uses: wordpress/plugin-check-action@v1.1.9
        with:
          build-dir: dist/undergrowth

name: E2E and accessibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (${{ matrix.locale }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Hebrew catches right-to-left layout bugs; en_XA catches clipped and
        # untranslated strings.
        locale: [en_US, he_IL, en_XA]
    env:
      UNDERGROWTH_E2E_LOCALE: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.3"
          coverage: none
      - uses: ramsey/composer-install@4.0.0
      - run: npm ci
      - name: Build
        if: hashFiles('src/**/*.js') != ''
        run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npx wp-env start
      - name: Switch to Hebrew
        if: matrix.locale == 'he_IL'
        run: npx wp-env run tests-cli wp language core install he_IL --activate
      - name: Switch to the pseudo-locale
        if: matrix.locale == 'en_XA'
        run: |
          npm run i18n:pseudo
          npx wp-env run tests-cli mkdir -p wp-content/languages/plugins
          npx wp-env run tests-cli --env-cwd=wp-content/plugins/undergrowth wp i18n make-mo languages/undergrowth-en_XA.po /var/www/html/wp-content/languages/plugins
          npx wp-env run tests-cli --env-cwd=wp-content/plugins/undergrowth wp i18n make-json languages/undergrowth-en_XA.po /var/www/html/wp-content/languages/plugins --no-purge
          npx wp-env run tests-cli wp option update WPLANG en_XA
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-${{ matrix.locale }}
          path: artifacts/
          retention-days: 7

  pa11y:
    name: pa11y-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: "8.3"
          coverage: none
      - uses: ramsey/composer-install@4.0.0
      - run: npm ci
      - name: Build
        if: hashFiles('src/**/*.js') != ''
        run: npm run build
      - run: npx wp-env start
      - run: npm run test:a11y

name: E2E and accessibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (${{ matrix.locale }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Hebrew catches right-to-left layout bugs; en_XA catches clipped and
        # untranslated strings.
        locale: [en_US, he_IL, en_XA]
    env:
      UNDERGROWTH_E2E_LOCALE: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: npm ci
      - name: Build
        if: hashFiles('src/**/*.js') != ''
        run: npm run build
      # The browser is cached by Playwright version; its system packages are not.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-browser.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
      - if: steps.playwright-browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx wp-env start
      - name: Switch to Hebrew
        if: matrix.locale == 'he_IL'
        run: npx wp-env run tests-cli wp language core install he_IL --activate
      - name: Switch to the pseudo-locale
        if: matrix.locale == 'en_XA'
        run: |
          npm run i18n:pseudo
          npx wp-env run tests-cli mkdir -p wp-content/languages/plugins
          npx wp-env run tests-cli --env-cwd=wp-content/plugins/undergrowth wp i18n make-mo languages/undergrowth-en_XA.po /var/www/html/wp-content/languages/plugins
          npx wp-env run tests-cli --env-cwd=wp-content/plugins/undergrowth wp i18n make-json languages/undergrowth-en_XA.po /var/www/html/wp-content/languages/plugins --no-purge
          npx wp-env run tests-cli wp option update WPLANG en_XA
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-${{ matrix.locale }}
          path: artifacts/
          retention-days: 7

  pa11y:
    name: pa11y-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No PHP, Composer or wp-env: WordPress Playground supplies the site.
      - run: npm run test:a11y

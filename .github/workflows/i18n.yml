name: I18N

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pot:
    name: POT is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - name: Build
        if: hashFiles('src/**/*.js') != ''
        run: |
          npm ci
          npm run build
      - run: npm run i18n:pot
      - name: Compare with the committed POT
        run: |
          git add --intent-to-add languages/undergrowth.pot
          if ! git diff --exit-code -I 'POT-Creation-Date' -I 'X-Generator' -- languages/; then
            echo "::error file=languages/undergrowth.pot::The POT is out of date. Run npm run i18n:pot and commit the result."
            exit 1
          fi

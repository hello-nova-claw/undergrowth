name: Build

on:
  push:
    branches: [main]
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zip:
    name: Plugin zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # The same copy the Plugin Check job checks, so what is checked is what ships.
      - run: mkdir -p dist && rsync -a --exclude-from=.distignore ./ dist/undergrowth/
      - name: Check the copy holds what the plugin needs
        run: |
          for file in undergrowth.php uninstall.php readme.txt LICENSE; do
            test -f "dist/undergrowth/$file" || { echo "::error::dist/undergrowth/$file is missing."; exit 1; }
          done
          for dir in src build languages; do
            test -d "dist/undergrowth/$dir" || { echo "::error::dist/undergrowth/$dir/ is missing."; exit 1; }
          done
          # The directory's assets go to SVN's assets folder, never into the plugin.
          for path in .wordpress-org CLAUDE.md; do
            test ! -e "dist/undergrowth/$path" || { echo "::error::dist/undergrowth/$path should not ship."; exit 1; }
          done
      - run: cd dist && zip -qr undergrowth.zip undergrowth && unzip -l undergrowth.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/undergrowth.zip
          archive: false
          if-no-files-found: error

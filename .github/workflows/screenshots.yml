name: Screenshots

# Takes the screenshot catalogue on the pull request and on its base, then
# posts the difference as one comment. It is for review only: it is not a
# required check, and a visual change never fails it.

on:
  pull_request:
    # Anything that can change what the screens look like, or how they are
    # captured.
    paths:
      - "src/**"
      - "languages/**"
      - "undergrowth.php"
      - "tests/e2e/**"
      - "playwright.screenshots.config.js"
      - "bin/compare-screenshots.mjs"
      - "bin/pseudo-locale.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/screenshots.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    name: Before and after (${{ matrix.locale }})
    # Pull requests from forks get a read-only token, and their code must not
    # run with write access anyway.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # The whole catalogue on both sides took over 50 minutes on one runner, so
    # each locale gets its own. One locale takes about 9 minutes a side, and
    # installing Chromium's system packages has taken up to 11 more.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        locale: [en_US, he_IL, en_XA]
    # This job runs the pull request's code, so it gets no write access. The
    # publish job below writes, and runs none of it.
    permissions:
      contents: read
    env:
      SHOTS: ${{ github.workspace }}/shots
      UNDERGROWTH_SCREENSHOTS_LOCALE: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: head/.nvmrc
          cache: npm
          cache-dependency-path: head/package-lock.json
      - run: npm ci
        working-directory: head
      - name: Build
        if: hashFiles('head/src/**/*.js', 'base/src/**/*.js') != ''
        run: |
          npm run build
          (cd ../base && npm ci && npm run build)
        working-directory: head
      # The browser is cached by Playwright version; its system packages are not.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: head
      - uses: actions/cache@v6.1.0
        id: playwright-browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-browser.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps
        working-directory: head
      - if: steps.playwright-browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: head

      # Both runs use this branch's spec, so a state added here is captured on
      # the base too, and shows as changed rather than new. Playground
      # downloads WordPress and WP-CLI as it boots, so each run gets a second
      # try before the comment reports it as failed. When only some states
      # failed, the second try takes just those, rather than the whole locale
      # again. A failed boot leaves no list of failures, so it starts over.
      - name: Take the "after" shots
        id: after
        continue-on-error: true
        working-directory: head
        env:
          UNDERGROWTH_SCREENSHOTS_DIR: ${{ env.SHOTS }}/after
        run: |
          rm -f artifacts/test-results/.last-run.json
          npm run screenshots || {
            if node -e "process.exit(require('./artifacts/test-results/.last-run.json').failedTests.length ? 0 : 1)" 2>/dev/null; then
              npm run screenshots -- --last-failed
            else
              npm run screenshots
            fi
          }
      - name: Take the "before" shots
        id: before
        continue-on-error: true
        working-directory: head
        env:
          UNDERGROWTH_PLUGIN_DIR: ${{ github.workspace }}/base
          UNDERGROWTH_SCREENSHOTS_DIR: ${{ env.SHOTS }}/before
        run: |
          rm -f artifacts/test-results/.last-run.json
          npm run screenshots || {
            if node -e "process.exit(require('./artifacts/test-results/.last-run.json').failedTests.length ? 0 : 1)" 2>/dev/null; then
              npm run screenshots -- --last-failed
            else
              npm run screenshots
            fi
          }

      # The compare job reads these to warn about a side that failed.
      - name: Record the outcome
        if: always()
        env:
          LOCALE: ${{ matrix.locale }}
          AFTER: ${{ steps.after.outcome }}
          BEFORE: ${{ steps.before.outcome }}
        run: |
          mkdir -p "${SHOTS}/status"
          echo "$AFTER" > "${SHOTS}/status/${LOCALE}-after"
          echo "$BEFORE" > "${SHOTS}/status/${LOCALE}-before"

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: screenshots-pr-${{ github.event.pull_request.number }}-${{ matrix.locale }}
          path: shots/
          retention-days: 1

  compare:
    name: Compare
    needs: capture
    # Runs when a locale failed too, so the comment shows the rest.
    if: ${{ !cancelled() && needs.capture.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This job runs the pull request's code too, so it gets no write access.
    permissions:
      contents: read
    env:
      SHOTS: ${{ github.workspace }}/shots
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Each shot's name includes its locale, so the sets merge without
      # clashes.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: screenshots-pr-${{ github.event.pull_request.number }}-*
          path: shots
          merge-multiple: true

      # The screenshots branch commit doesn't exist yet, so the publish job
      # fills in its SHA.
      - name: Write the comment
        env:
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p "$SHOTS"
          node bin/compare-screenshots.mjs "${SHOTS}/before" "${SHOTS}/after" \
            "https://github.com/${REPOSITORY}/blob/SCREENSHOTS_SHA/pr-${PR}" > "${SHOTS}/comment.md"

          # A failed run would make every shot look new or removed, so say so
          # at the top rather than let the table pass for a real result. A
          # locale whose job never finished has no outcome, and counts as
          # failed.
          failed() {
            for locale in en_US he_IL en_XA; do
              if [ "$(cat "${SHOTS}/status/${locale}-$1" 2>/dev/null)" != success ]; then
                printf '%s ' "$locale"
              fi
            done
          }
          after=$(failed after)
          before=$(failed before)
          warning=''
          if [ -n "$after" ]; then
            warning="${warning}> [!WARNING]\n> Some \"after\" shots could not be taken (${after% }), so they may show as removed. See the workflow run.\n\n"
          fi
          if [ -n "$before" ]; then
            warning="${warning}> [!WARNING]\n> Some \"before\" shots could not be taken (${before% }), so they may show as new. See the workflow run.\n\n"
          fi
          if [ -n "$warning" ]; then
            { head -n 3 "${SHOTS}/comment.md"; printf '%b' "$warning"; tail -n +4 "${SHOTS}/comment.md"; } > "${RUNNER_TEMP}/comment.md"
            mv "${RUNNER_TEMP}/comment.md" "${SHOTS}/comment.md"
          fi
          rm -rf "${SHOTS}/status"

          printf '\n[Workflow run and full set](%s/%s/actions/runs/%s)\n' \
            "$GITHUB_SERVER_URL" "$REPOSITORY" "$GITHUB_RUN_ID" >> "${SHOTS}/comment.md"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots-pr-${{ github.event.pull_request.number }}
          path: shots/
          retention-days: 90

  publish:
    name: Publish
    needs: compare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Pinned by commit because this job holds a write token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots-pr-${{ github.event.pull_request.number }}
          path: shots

      # Each pull request owns pr-<number>/ on the orphan screenshots branch.
      # Every push replaces that folder in a new commit, so the history keeps
      # every version, and identical images cost nothing to store again.
      - name: Commit to the screenshots branch
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          shots="$PWD/shots"
          mkdir branch && cd branch
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git remote add origin "https://github.com/${REPOSITORY}.git"

          pushed=''
          for _ in 1 2 3; do
            if git fetch -q --depth 1 origin screenshots; then
              git checkout -q -B screenshots FETCH_HEAD
            else
              git checkout -q --orphan screenshots
            fi

            rm -rf "pr-${PR}"
            mkdir -p "pr-${PR}"
            for side in before after; do
              if [ -d "${shots}/${side}" ]; then
                cp -R "${shots}/${side}" "pr-${PR}/${side}"
              fi
            done

            git add -A "pr-${PR}"
            if git rev-parse -q --verify HEAD >/dev/null && git diff --cached --quiet; then
              pushed=yes
              break
            fi
            git commit -q -m "Screenshots for #${PR} at ${HEAD_SHA:0:7}."

            # Another pull request may have pushed in the meantime. The next
            # try starts again from the fetched branch.
            if git push -q origin screenshots; then
              pushed=yes
              break
            fi
          done

          if [ -z "$pushed" ]; then
            echo "::error::Could not push to the screenshots branch."
            exit 1
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          sed "s/SCREENSHOTS_SHA/${SHA}/g" shots/comment.md > "${RUNNER_TEMP}/comment.md"

          id=$(gh api --paginate "repos/${REPOSITORY}/issues/${PR}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- undergrowth-screenshots -->"))) | .id' | head -n 1)

          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${REPOSITORY}/issues/comments/${id}" -F body=@"${RUNNER_TEMP}/comment.md" > /dev/null
          else
            gh api -X POST "repos/${REPOSITORY}/issues/${PR}/comments" -F body=@"${RUNNER_TEMP}/comment.md" > /dev/null
          fi

name: PHP

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
      # Audits the lock file, including dev tools, so no install is needed.
      - run: composer audit --locked

  phpcs:
    name: PHPCS (WPCS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
          tools: cs2pr
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: vendor/bin/phpcs -q --report=checkstyle | cs2pr

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: composer analyse -- --error-format=github --no-progress

  phpunit:
    name: PHPUnit (WP ${{ matrix.wp }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { wp: "6.9", core: "WordPress/WordPress#6.9-branch", php: "7.4" }
          - { wp: "7.0", core: "WordPress/WordPress#7.0-branch", php: "8.3" }
          - { wp: latest, core: "", php: "8.4" }
          - { wp: trunk, core: "WordPress/WordPress#master", php: "8.4" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
      - run: npm ci
      - name: Start wp-env
        env:
          CORE: ${{ matrix.core }}
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
        run: |
          if [ -n "$CORE" ]; then export WP_ENV_CORE="$CORE"; fi
          npx wp-env start
      - run: npm run test:php
      - run: npm run test:php:multisite

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Runs on the runner rather than in wp-env: wp-env adds Xdebug with
    # `pecl install`, so every pecl.php.net outage failed this required check.
    # setup-php brings Xdebug from its own builds instead.
    services:
      mysql:
        # The image wp-env uses.
        image: mariadb:lts
        env:
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: wordpress/wp-content/plugins/undergrowth
    env:
      WP_TESTS_DIR: ${{ github.workspace }}/wordpress-phpunit
    steps:
      # The plugin sits where wp-env mounts it, so file paths match.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: wordpress/wp-content/plugins/undergrowth
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: xdebug
          extensions: mysqli
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: wordpress/wp-content/plugins/undergrowth
      # Like wp-env with "core": null: the latest release, and the PHPUnit
      # suite from wordpress-develop at the same tag.
      - name: Find the latest WordPress release
        id: wordpress
        working-directory: ${{ github.workspace }}
        run: |
          version=$(curl -fsSL --retry 5 https://api.wordpress.org/core/version-check/1.7/ | jq -r '.offers[0].version')
          echo "WordPress $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The test suite changes only with the release, so it is cloned once a release.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: test-suite
        with:
          path: ${{ env.WP_TESTS_DIR }}
          key: wordpress-phpunit-${{ steps.wordpress.outputs.version }}
      - name: Install WordPress and its test suite
        working-directory: ${{ github.workspace }}
        env:
          WP_VERSION: ${{ steps.wordpress.outputs.version }}
          SUITE_CACHED: ${{ steps.test-suite.outputs.cache-hit }}
        run: |
          curl -fsSL --retry 5 -o wordpress.tar.gz "https://wordpress.org/wordpress-$WP_VERSION.tar.gz"
          tar -xzf wordpress.tar.gz
          if [ "$SUITE_CACHED" != "true" ]; then
            git clone --quiet --depth=1 --filter=blob:none --sparse --branch "$WP_VERSION" https://github.com/WordPress/wordpress-develop.git wordpress-develop
            git -C wordpress-develop sparse-checkout set tests/phpunit
            mv wordpress-develop/tests/phpunit "$WP_TESTS_DIR"
          fi
          cat > "$WP_TESTS_DIR/wp-tests-config.php" <<'PHP'
          <?php
          define( 'ABSPATH', getenv( 'GITHUB_WORKSPACE' ) . '/wordpress/' );
          define( 'WP_DEFAULT_THEME', 'default' );
          define( 'DB_NAME', 'wordpress_test' );
          define( 'DB_USER', 'root' );
          define( 'DB_PASSWORD', 'password' );
          define( 'DB_HOST', '127.0.0.1:3306' );
          define( 'DB_CHARSET', 'utf8' );
          define( 'DB_COLLATE', '' );
          define( 'WP_DEBUG', true );
          define( 'SCRIPT_DEBUG', true );
          define( 'WP_ENVIRONMENT_TYPE', 'local' );
          define( 'WP_PHP_BINARY', 'php' );
          define( 'WP_TESTS_DOMAIN', 'localhost:8889' );
          define( 'WP_TESTS_EMAIL', 'admin@example.org' );
          define( 'WP_TESTS_TITLE', 'Test Blog' );
          $table_prefix = 'wptests_';
          PHP
      # Network-only code runs only in the multisite suite, so both runs count.
      - run: vendor/bin/phpunit --coverage-php coverage/single-site.cov
      - run: vendor/bin/phpunit -c phpunit-multisite.xml.dist --coverage-php coverage/multisite.cov
      - run: vendor/bin/phpcov merge --clover coverage/clover.xml coverage
      # The bar comes from the branch this merges into, so a pull request
      # cannot lower it in the same commit that lowers the coverage.
      - name: Read the base branch's baseline
        env:
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:.github/coverage-baseline > "$RUNNER_TEMP/coverage-baseline-base"
      - run: php bin/coverage-gate.php coverage/clover.xml .github/coverage-baseline "$RUNNER_TEMP/coverage-baseline-base"

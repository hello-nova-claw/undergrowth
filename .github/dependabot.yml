version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "Build/Test Tools:"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "Build/Test Tools:"
    groups:
      composer-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "Build/Test Tools:"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

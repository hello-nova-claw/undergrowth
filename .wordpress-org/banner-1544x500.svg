<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500">
	<title>Undergrowth</title>
	<!--
		Interim banner. The sprout is the one in icon.svg; the dotted lines link leaf tips the way Undergrowth links posts.
		Colours are from the WordPress admin green scale. The text is set in Source Serif 4 (SIL Open Font License).
		The bottom left is kept empty because WordPress.org can lay the plugin name over it.
		banner-772x250.svg is this drawing at half size; change both together.
	-->
	<defs>
		<g id="sprout">
			<path d="M62 104 Q 118 26 198 70" fill="none" stroke="#b8e6bf" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 14"/>
			<path d="M128 214 C 128 186 125 160 128 128" fill="none" stroke="#68de7c" stroke-width="10" stroke-linecap="round"/>
			<path d="M126 162 C 100 166 66 140 62 104 C 98 102 124 128 126 162 Z" fill="#68de7c"/>
			<path d="M129 138 C 130 102 160 74 198 70 C 196 110 168 140 129 138 Z" fill="#b8e6bf"/>
			<circle cx="62" cy="104" r="12" fill="#edfaef"/>
			<circle cx="198" cy="70" r="12" fill="#edfaef"/>
		</g>
		<path id="pinna" d="M0 0 C 14 -11 38 -11 52 0 C 38 11 14 11 0 0 Z"/>
	</defs>
	<rect width="1544" height="500" fill="#00450c"/>

	<text x="112" y="206" fill="#edfaef" font-family="'Source Serif 4', Georgia, serif" font-size="108" font-weight="600">Undergrowth</text>
	<text x="116" y="274" fill="#b8e6bf" font-family="'Source Serif 4', Georgia, serif" font-size="40">Your posts, linked in your own words.</text>

	<!-- Links between the tips of the sprouts and the fern. -->
	<g fill="none" stroke="#b8e6bf" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 16">
		<path d="M1151 253 Q 1150 150 1210 100"/>
		<path d="M1210 100 Q 1330 160 1341 341"/>
	</g>

	<!-- Fern. -->
	<path d="M1250 440 C 1250 330 1232 200 1210 100" fill="none" stroke="#68de7c" stroke-width="8" stroke-linecap="round"/>
	<g fill="#68de7c">
		<use href="#pinna" transform="translate(1249 392) rotate(-158) scale(1.6)"/>
		<use href="#pinna" transform="translate(1249 392) rotate(-22) scale(1.6)"/>
		<use href="#pinna" transform="translate(1246 344) rotate(-156) scale(1.45)"/>
		<use href="#pinna" transform="translate(1246 344) rotate(-26) scale(1.45)"/>
		<use href="#pinna" transform="translate(1241 298) rotate(-154) scale(1.3)"/>
		<use href="#pinna" transform="translate(1241 298) rotate(-30) scale(1.3)"/>
		<use href="#pinna" transform="translate(1235 254) rotate(-150) scale(1.1)"/>
		<use href="#pinna" transform="translate(1235 254) rotate(-34) scale(1.1)"/>
		<use href="#pinna" transform="translate(1228 212) rotate(-146) scale(0.9)"/>
		<use href="#pinna" transform="translate(1228 212) rotate(-38) scale(0.9)"/>
		<use href="#pinna" transform="translate(1221 174) rotate(-142) scale(0.7)"/>
		<use href="#pinna" transform="translate(1221 174) rotate(-42) scale(0.7)"/>
		<use href="#pinna" transform="translate(1215 140) rotate(-136) scale(0.5)"/>
		<use href="#pinna" transform="translate(1215 140) rotate(-48) scale(0.5)"/>
	</g>
	<circle cx="1210" cy="100" r="13" fill="#edfaef"/>

	<!-- Sprouts. -->
	<use href="#sprout" transform="translate(893.6 161.8) scale(1.3)"/>
	<use href="#sprout" transform="translate(1284.8 247.4) scale(0.9)"/>

	<!-- Ground. -->
	<path d="M930 440 H 1490" fill="none" stroke="#008a20" stroke-width="8" stroke-linecap="round"/>
</svg>
